name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-groups --frozen
      - run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python scripts/validate_frozen_evidence_bytes.py
      - run: uv run pytest --cov=vietnamese_labor_law_assistant
      - run: uv run python scripts/verify_week9_agent.py
      - run: uv run python scripts/verify_week10_guardrail.py
      - run: uv run python scripts/generate_week12_portfolio.py --check
      - run: uv run python scripts/generate_portfolio_assets.py --check
      - run: uv run python scripts/validate_week12_release.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit dev --audit-level high

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: git diff --check
      - run: python .agents/skills/protected-artifact-guard/scripts/scan_protected_diff.py
      - run: APP_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
